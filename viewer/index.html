<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enlive Viewer</title>
  </head>
  <body>
    <div id="app">
      <canvas id="live2d-canvas"></canvas>
      <div id="overlay">
        <div id="loading">Loading...</div>
        <div id="status-bar">
          <span id="connection-status">● Disconnected</span>
          <span id="model-name">—</span>
        </div>
        <div id="expressions-bar" class="hidden">
          <span class="tag">Expressions:</span>
          <span id="expression-list"></span>
        </div>
        <div id="motions-bar" class="hidden">
          <span class="tag">Motions:</span>
          <span id="motion-list"></span>
        </div>
      </div>
    </div>
    <!-- Cubism Core (global) -->
    <script src="/cubism-core/live2dcubismcore.min.js"></script>
    <!-- Core API shim (patches missing APIs for wasm2js) -->
    <script src="/cubism-core/cubism-core-shim.js"></script>
    <!-- Viewer app -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
